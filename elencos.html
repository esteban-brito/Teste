<!DOCTYPE html>
<!--
  draft9-0 · Base de Elencos — página-irmã do jogo (index.html).
  Separada e autossuficiente: mesma identidade visual (paleta arena, fontes,
  favicon), mas nenhuma dependência do game.js/style.css. Só leitura de dados.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="draft9-0 — base de elencos: OVR, funções, atributos e rating de todos os times, jogadores e treinadores.">
<meta name="theme-color" content="#080b10">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://esteban-brito.github.io/Teste/elencos.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2307090e'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='700' text-anchor='middle' fill='%23ff5a1f'%3E9%3C/text%3E%3C/svg%3E">
<title>draft9-0 · Base de Elencos</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* ---------- tokens: paleta ARENA idêntica ao jogo (dark único, como o game) ---------- */
/* valores sincronizados com a camada "Clean Matchday refinement" de style.css (2026-07-09) */
:root{
  --ground:#080b10; --panel:#0d131d; --panel2:#111826; --line:#2c394e; --line2:#161d2c;
  --ink:#f2f6fb; --ink2:#c4cfdd; --muted:#8b9bb0; --faint:#94a3b8; --dim:#94a3b8;
  --accent:#ff6b2a; --accent-ink:#07090e; --cyan:#4bd7ff;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 12px 34px rgba(0,0,0,.5);
  --barbg:rgba(255,255,255,.08);
  --ff:'Chakra Petch'; --fb:'Barlow Semi Condensed';
  /* faixas de OVR: dourado · âmbar · laranja(accent) · ciano · prata — do próprio jogo */
  --t22:#ffce4a; --t22i:#07090e; --t21:#f0a93a; --t21i:#07090e; --t18:#ff6b2a; --t18i:#07090e;
  --t15:#4bd7ff; --t15i:#07090e; --t14:#aab6c4; --t14i:#0b1119;
}
*{box-sizing:border-box; margin:0; padding:0}
body{
  background:radial-gradient(1200px 600px at 50% -10%,#121a26 0%,transparent 65%),var(--ground);
  color:var(--ink); font-family:var(--fb),'Segoe UI',sans-serif;
  font-size:15px; line-height:1.4; -webkit-font-smoothing:antialiased;
  min-height:100vh; min-height:100dvh; overflow-x:hidden;
}
.mono{font-family:var(--ff),ui-monospace,monospace; font-variant-numeric:tabular-nums; letter-spacing:.01em}

/* ---------- top bar ---------- */
header{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
}
.hwrap{max-width:1180px; margin:0 auto; padding:14px 20px 12px; display:flex; flex-direction:column; gap:12px}
.brandrow{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.backlink{font-family:var(--fb);font-weight:700;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:8px 13px;border-radius:9px;
  transition:color .15s,border-color .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.backlink:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.backlink .ar{font-size:1.05em;line-height:0}
.logo{font-family:var(--ff);font-weight:700;font-size:clamp(1.12rem,3.3vw,1.5rem);letter-spacing:.06em;line-height:1}
.logo b{color:var(--accent)}
.logo span{display:block;font-family:var(--fb);color:var(--muted);font-size:.56rem;letter-spacing:.26em;
  text-transform:uppercase;font-weight:600;margin-top:5px}
.counts{display:flex; gap:16px; margin-left:auto; align-items:center}
.counts .c{display:flex; align-items:baseline; gap:5px}
.counts .cv{font-size:1.1rem}
.counts .cl{font-size:.62rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); font-weight:600}

.controls{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.search{position:relative; flex:1; min-width:180px; max-width:320px}
.search input{
  width:100%; padding:8px 12px 8px 32px; border-radius:9px; border:1px solid var(--line);
  background:var(--panel); color:var(--ink); font-size:.9rem; font-family:inherit;
}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--faint)}
.seg{display:flex; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:2px; gap:2px}
.seg button{
  border:0; background:transparent; color:var(--muted); font-family:inherit; font-weight:700;
  font-size:.8rem; padding:6px 12px; border-radius:7px; cursor:pointer; letter-spacing:.01em;
}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.btn{
  border:1px solid var(--line); background:var(--panel); color:var(--ink2); cursor:pointer;
  font-family:inherit; font-weight:700; font-size:.8rem; padding:7px 12px; border-radius:9px;
}
.btn:hover{border-color:var(--muted)}
.chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.chip{
  border:1px solid var(--line); background:var(--panel); color:var(--muted); cursor:pointer;
  font-family:inherit; font-weight:700; font-size:.74rem; padding:5px 10px; border-radius:20px;
  letter-spacing:.02em; display:inline-flex; gap:6px; align-items:center;
}
.chip .dot{width:8px; height:8px; border-radius:50%}
.chip[aria-pressed="true"]{color:var(--ink); border-color:currentColor}
.chip[aria-pressed="true"].role-all{border-color:var(--accent); color:var(--accent)}

:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.btn[aria-pressed="true"]{border-color:var(--accent); color:var(--accent)}
.tag.dupe{color:var(--cyan); border:1px solid color-mix(in srgb,var(--cyan) 45%,transparent)}
.tag.dev-up{color:var(--t21); border:1px solid color-mix(in srgb,var(--t21) 50%,transparent)}
.tag.dev-dn{color:var(--t15); border:1px solid color-mix(in srgb,var(--t15) 50%,transparent)}
.rowh [data-key]{cursor:pointer; user-select:none; transition:color .12s}
.rowh [data-key]:hover{color:var(--ink)}
.rowh [data-key].on{color:var(--accent)}
.rowh [data-key].on::after{content:" ▾"}

/* ---------- main ---------- */
main{max-width:1180px; margin:0 auto; padding:20px 20px 80px}
.hint{color:var(--muted); font-size:.8rem; margin:0 2px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.hint b{color:var(--ink2)}

.scroller{overflow-x:auto; overscroll-behavior-x:contain}

/* team panel */
.team{
  background:var(--panel); border:1px solid var(--line); border-radius:14px; margin-bottom:16px;
  box-shadow:var(--shadow); overflow:hidden;
}
.team-head{
  display:flex; align-items:center; gap:14px; padding:13px 16px; border-bottom:1px solid var(--line2);
  position:relative;
}
.team-head::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--tc)}
.tbadge{
  font-family:var(--ff); font-weight:700; font-size:.86rem; letter-spacing:.03em; min-width:44px; height:44px; padding:0 10px;
  display:flex; align-items:center; justify-content:center; border-radius:10px;
  /* texto = cor do time clareada · fundo = cor do time bem escurecida → contraste AA garantido, identidade mantida */
  background:color-mix(in srgb,var(--tc) 13%,var(--ground)); color:color-mix(in srgb,var(--tc) 64%,var(--ink)); border:1px solid color-mix(in srgb,var(--tc) 40%,transparent);
}
.tmeta{display:flex; flex-direction:column; gap:2px; min-width:0}
.tname{font-family:var(--ff); font-weight:700; font-size:1.02rem; letter-spacing:.02em; display:flex; align-items:center; gap:8px}
.tcamp{font-size:.74rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tcrown{font-size:.62rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--t22);
  border:1px solid color-mix(in srgb,var(--t22) 45%,transparent); padding:1px 6px; border-radius:5px}
.tright{margin-left:auto; display:flex; align-items:center; gap:16px}
.tavg{text-align:right}
.tavg .v{font-weight:800; font-size:1.3rem; line-height:1}
.tavg .l{font-size:.62rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.coach{
  display:flex; align-items:center; gap:9px; padding:6px 11px 6px 8px; border-radius:10px;
  background:var(--panel2); border:1px solid var(--line);
}
.coach .cova{
  width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:.82rem; background:var(--barbg);
}
.coach .cinfo{display:flex; flex-direction:column; line-height:1.15}
.coach .cn{font-weight:700; font-size:.84rem}
.coach .cc{font-size:.68rem; color:var(--caraccol,var(--muted)); font-weight:700; letter-spacing:.01em}
.coach.none{color:var(--faint)}
.coach.none .cn{color:var(--faint); font-weight:600; font-style:italic}

/* player table */
.grid{min-width:760px}
.row{
  display:grid;
  grid-template-columns:48px minmax(148px,1.5fr) 158px repeat(7,minmax(34px,40px)) 60px;
  align-items:center; gap:9px; padding:9px 16px; border-bottom:1px solid var(--line2);
}
.row:last-child{border-bottom:0}
.rowh{
  padding-top:8px; padding-bottom:8px; border-bottom:1px solid var(--line);
  font-size:.62rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:700;
  background:var(--panel2); position:sticky; top:0;
}
.rowh .sh{text-align:center}
.rowh .rt{text-align:right}
.body .row:hover{background:var(--panel2)}

.ovr{
  font-weight:800; font-size:1.14rem; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  background:var(--tbg); color:var(--tink); letter-spacing:-.02em;
}
.pl{display:flex; flex-direction:column; gap:2px; min-width:0}
.pl .nm{font-weight:700; font-size:.96rem; display:flex; align-items:center; gap:6px; letter-spacing:-.01em}
.pl .nm .txt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.star{color:var(--t22)}
.tag{font-size:.58rem; font-weight:800; letter-spacing:.04em; padding:1px 5px; border-radius:5px; text-transform:uppercase}
.tag.igl{color:var(--t22); border:1px solid color-mix(in srgb,var(--t22) 45%,transparent)}
.tag.team{color:var(--muted); border:1px solid var(--line); font-weight:700}
.pl .meta{font-size:.68rem; color:var(--faint); display:flex; gap:7px}

.roles{display:flex; flex-direction:column; gap:3px; min-width:0}
.rline{display:flex; align-items:center; gap:6px}
.rpill{font-size:.66rem; font-weight:800; letter-spacing:.02em; padding:2px 7px; border-radius:6px;
  color:var(--rc); background:color-mix(in srgb,var(--rc) 16%,transparent); white-space:nowrap}
.rsec{font-size:.68rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rsec b{color:var(--ink2); font-weight:700}
.sub{font-size:.66rem; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.st{display:flex; flex-direction:column; align-items:center; gap:3px}
.st .sv{font-size:.82rem; font-weight:600}
.st .bar{width:100%; height:3px; border-radius:2px; background:var(--barbg); overflow:hidden}
.st .bar i{display:block; height:100%; background:var(--ink2); opacity:.55; border-radius:2px}
.st.hi .sv{color:var(--ink)}
.st.hi .bar i{background:var(--accent); opacity:.9}
.st.lo .sv{color:var(--faint)}

.rat{text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:3px}
.rat .rv{font-size:.98rem; font-weight:700}
.rat .rbar{width:44px; height:3px; border-radius:2px; background:var(--barbg); overflow:hidden}
.rat .rbar i{display:block; height:100%; background:var(--cyan); border-radius:2px}

/* ranking view */
.rankwrap .team{margin-bottom:0}
.rank .row{grid-template-columns:38px 48px minmax(148px,1.5fr) 158px repeat(7,minmax(34px,40px)) 60px}
.rnk{font-weight:800; font-size:.9rem; color:var(--faint); text-align:center}

.empty{padding:60px 20px; text-align:center; color:var(--muted)}
.empty b{color:var(--ink); display:block; font-size:1.1rem; margin-bottom:6px}

footer{max-width:1180px; margin:0 auto; padding:8px 20px 46px; text-align:center; display:flex; flex-direction:column; gap:10px}
footer .foot-line{color:var(--faint); font-size:.74rem}
footer .foot-line b{color:var(--muted); font-weight:700; letter-spacing:.02em}
footer .foot-sig{font-family:var(--ff); color:var(--dim,var(--faint)); font-size:.6rem; letter-spacing:.24em; text-transform:uppercase}

@media (max-width:640px){
  .counts{width:100%; margin-left:0; justify-content:flex-start}
  .hwrap{padding:12px 14px}
  main{padding:16px 14px 60px}
  /* cabeçalho do time: treinador + média descem pra 2ª linha → nome e selo "campeão" nunca cortam */
  .team-head{flex-wrap:wrap; gap:10px 12px}
  .tmeta{flex:1 1 auto}
  .tright{order:3; width:100%; margin-left:0; justify-content:space-between; gap:12px;
    border-top:1px solid var(--line2); padding-top:11px}
  .tcrown{flex:none}
}
@media (prefers-reduced-motion:no-preference){
  .team{animation:rise .4s ease both}
  @keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
}
</style>
</head>

const CAMPEAO=t=>/campe/i.test(t.coloc||"");

function tierVars(o){
  const t=o>=22?"22":o>=21?"21":o>=18?"18":o>=15?"15":"14";
  return `--tbg:var(--t${t});--tink:var(--t${t}i)`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

const state={view:"teams", role:"all", q:"", sort:"o", dev:false};
const $=id=>document.getElementById(id);

/* auditoria: percentil de OVR × percentil de rating no pool inteiro.
   desvio grande = OVR fora do que o rating real sugere → candidato a correção. */
const ALL=[];DATA.forEach(t=>t.p.forEach(p=>ALL.push(p)));
const pctOf=key=>{const sorted=[...ALL].sort((a,b)=>key(a)-key(b));const m=new Map();
  sorted.forEach((p,i)=>m.set(p,i/(sorted.length-1)));return m;};
const pO=pctOf(p=>p.o), pR=pctOf(p=>p.rt);
ALL.forEach(p=>{p._dev=pO.get(p)-pR.get(p); p._flag=Math.abs(p._dev)>=0.30;});
const nickCount={};ALL.forEach(p=>nickCount[p.n]=(nickCount[p.n]||0)+1);
ALL.forEach(p=>{p._dupe=nickCount[p.n]>1;});
const LABEL={o:"OVR",rt:"Rating",fp:"Firepower",en:"Entrada",tr:"Trade",op:"Abertura",cl:"Clutch",sn:"AWP",ut:"Utilitário"};

// header counts
$("cTeams").textContent=DATA.length;
$("cPlayers").textContent=DATA.reduce((s,t)=>s+t.p.length,0);
$("cCoach").textContent=DATA.filter(t=>t.c).length;

// role chips
const roles=["all",...Object.keys(ROLE)];
$("roleChips").innerHTML=roles.map(r=>{
  const on=state.role===r;
  if(r==="all")return `<button class="chip role-all" data-role="all" aria-pressed="${on}">Todas as funções</button>`;
  return `<button class="chip" data-role="${r}" aria-pressed="${on}" style="--rc:${ROLE[r].c}"><span class="dot" style="background:${ROLE[r].c}"></span>${r}</button>`;
}).join("");
$("roleChips").addEventListener("click",e=>{
  const b=e.target.closest("[data-role]"); if(!b)return;
  state.role=b.dataset.role; syncChips(); render();
});
function syncChips(){[...$("roleChips").children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.role===state.role))}

// search
$("q").addEventListener("input",e=>{state.q=e.target.value.trim().toLowerCase(); render()});

// view toggle
$("vTeams").onclick=()=>{state.view="teams"; $("vTeams").setAttribute("aria-pressed","true"); $("vRank").setAttribute("aria-pressed","false"); render()};
$("vRank").onclick=()=>{state.view="rank"; $("vRank").setAttribute("aria-pressed","true"); $("vTeams").setAttribute("aria-pressed","false"); render()};
// filtro de desvios OVR×rating
$("devN").textContent="("+ALL.filter(p=>p._flag).length+")";
$("devBtn").onclick=()=>{state.dev=!state.dev; $("devBtn").setAttribute("aria-pressed",String(state.dev)); render()};
// ordenar clicando no cabeçalho da coluna (só no ranking)
$("board").addEventListener("click",e=>{
  const h=e.target.closest("[data-key]"); if(!h||state.view!=="rank")return;
  state.sort=h.dataset.key; render();
});
$("board").addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" ")return;
  const h=e.target.closest("[data-key]"); if(!h||state.view!=="rank")return;
  e.preventDefault(); state.sort=h.dataset.key; render();
});


function matchP(p,teamName){
  if(state.dev&&!p._flag)return false;
  if(state.role!=="all"&&p.r1!==state.role)return false;
  if(state.q){const h=(p.n+" "+teamName+" "+(p.ps||"")+" "+p.r1+" "+p.r2).toLowerCase(); if(!h.includes(state.q))return false;}
  return true;
}
function statCell(v){
  const cls=v>=70?"hi":v<40?"lo":"";
  return `<div class="st ${cls}"><span class="sv mono">${v}</span><span class="bar"><i style="width:${v}%"></i></span></div>`;
}
function ratCell(rt){
  const w=Math.max(4,Math.min(100,(rt-0.75)/(1.75-0.75)*100));
  return `<div class="rat"><span class="rv mono">${rt.toFixed(2)}</span><span class="rbar"><i style="width:${w}%"></i></span></div>`;
}
function playerRow(p,teamName,rank){
  const rc=ROLE[p.r1]||{c:"var(--muted)",ab:p.r1};
  const secTxt=p.r2&&p.r2!==p.r1?`<span class="rsec">${p.sf?"":"<span style='opacity:.6'>·</span> "}<b>${esc(ROLE[p.r2]?.ab||p.r2)}</b> 2ª</span>`:"";
  const meta=[p.pa].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("");
  const tags=[
    p.igl?'<span class="tag igl">IGL</span>':"",
    p._dupe?'<span class="tag dupe" title="Mesmo nick em 2 elencos (multi-época)">2×</span>':"",
    p._flag?(p._dev>0
      ?'<span class="tag dev-up" title="OVR alto para o rating real — candidato a descer">OVR↑</span>'
      :'<span class="tag dev-dn" title="OVR baixo para o rating real — candidato a subir">OVR↓</span>'):"",
    (state.view==="rank")?`<span class="tag team">${esc(teamName)}</span>`:""
  ].join("");
  return `<div class="row" style="${tierVars(p.o)}">
    ${rank!=null?`<div class="rnk mono">${rank}</div>`:""}
    <div class="ovr mono">${p.o}</div>
    <div class="pl">
      <div class="nm">${p.st?'<span class="star">★</span>':""}<span class="txt">${esc(p.n)}</span>${tags}</div>
      <div class="meta">${meta}</div>
    </div>
    <div class="roles">
      <div class="rline"><span class="rpill" style="--rc:${rc.c}">${rc.ab}</span>${secTxt}</div>
      <div class="sub">${esc(p.ps||"—")}</div>
    </div>
    ${STAT.map(([k])=>statCell(p.s[k])).join("")}
    ${ratCell(p.rt)}
  </div>`;
}
function headerRow(withRank){
  const sortable=withRank; // ranking: clique no cabeçalho ordena
  const dk=(k,cls,txt,title)=>sortable
    ?`<div class="${cls} ${state.sort===k?"on":""}" data-key="${k}" title="${title||"Ordenar por "+LABEL[k]}" role="button" tabindex="0">${txt}</div>`
    :`<div class="${cls}" title="${title||""}">${txt}</div>`;
  return `<div class="row rowh">
    ${withRank?'<div class="sh">#</div>':""}
    ${dk("o","","OVR")}<div>Jogador</div><div>Função</div>
    ${STAT.map(([k,l])=>dk(k,"sh",l,STATFULL[k]+(sortable?" — clique p/ ordenar":""))).join("")}
    ${dk("rt","rt","Rating")}
  </div>`;
}
function coachChip(c,mini){
  if(!c)return `<div class="coach none ${mini?"mini":""}"><div class="cinfo"><span class="cn">sem treinador</span></div></div>`;
  const col=CARAC[c.ca]||"var(--muted)";
  return `<div class="coach ${mini?"mini":""}" style="--caraccol:${col}">
    <div class="cova mono">${c.o}</div>
    <div class="cinfo"><span class="cn">${esc(c.n)}</span><span class="cc">${esc(c.ca||"treinador")}</span></div>
  </div>`;
}

function render(){
  const board=$("board"); const hint=$("hint");
  if(state.view==="teams"){
    let html=""; let shown=0, teamsShown=0;
    DATA.forEach(t=>{
      const ps=t.p.filter(p=>matchP(p,t.n));
      if(!ps.length)return;
      teamsShown++; shown+=ps.length;
      const avg=(t.p.reduce((s,p)=>s+p.o,0)/t.p.length);
      html+=`<div class="team" style="--tc:${t.cor}">
        <div class="team-head ${t.c?"hascoach":""}">
          <div class="tbadge">${esc(t.n).slice(0,4).toUpperCase()}</div>
          <div class="tmeta">
            <div class="tname">${esc(t.n)} ${CAMPEAO(t)?'<span class="tcrown">campeão</span>':""}</div>
            <div class="tcamp">${esc(t.camp||"")}</div>
          </div>
          <div class="tright">
            ${coachChip(t.c,true)}
            <div class="tavg"><div class="v mono">${avg.toFixed(1)}</div><div class="l">OVR médio</div></div>
          </div>
        </div>
        <div class="scroller"><div class="grid">
          ${headerRow(false)}
          <div class="body">${ps.map(p=>playerRow(p,t.n,null)).join("")}</div>
        </div></div>
      </div>`;
    });
    board.innerHTML=html||emptyState();
    hint.innerHTML=`<b>${teamsShown}</b> times · <b>${shown}</b> jogadores · ordenados por OVR médio (do mais forte ao mais fraco); dentro do time, por OVR.${state.dev?" · <b>só desvios OVR×rating</b>":""}`;
  }else{
    const all=[];
    DATA.forEach(t=>t.p.forEach(p=>{if(matchP(p,t.n))all.push({p,tn:t.n,tc:t.cor})}));
    const val=x=> state.sort==="o"?x.p.o : state.sort==="rt"?x.p.rt : x.p.s[state.sort];
    all.sort((a,b)=> (val(b)-val(a)) || (b.p.o-a.p.o) || (b.p.rt-a.p.rt));
    const rows=all.map((x,i)=>playerRow(x.p,x.tn,i+1)).join("");
    board.innerHTML=all.length?`<div class="rank team" style="--tc:var(--accent)">
      <div class="scroller"><div class="grid" style="min-width:820px">
        ${headerRow(true)}
        <div class="body">${rows}</div>
      </div></div></div>`:emptyState();
    hint.innerHTML=`<b>${all.length}</b> jogadores no ranking geral · ordenado por <b>${LABEL[state.sort]}</b> (clique num cabeçalho pra reordenar)${state.role!=="all"?` · função <b>${state.role}</b>`:""}${state.dev?` · <b>só desvios OVR×rating</b>`:""}.`;
  }
}
function emptyState(){return `<div class="empty"><b>Nada encontrado</b>Ajuste a busca ou o filtro de função.</div>`}

render();
</script>
</body>
</html>
