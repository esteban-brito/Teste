name: Deploy to GitHub Pages
on:
  push:
    branches: [sandbox-test]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run lint
      - run: npm run bench
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Stamp cache-busting version com hash de conteúdo
        run: |
          css=$(sha1sum style.css | cut -c1-8)
          js=$(sha1sum game.js | cut -c1-8)
          sed -i "s/style\.css?v=DEV/style.css?v=$css/g; s/game\.js?v=DEV/game.js?v=$js/g" \
            index.html prototipo-cartas.html recorte-retratos.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
